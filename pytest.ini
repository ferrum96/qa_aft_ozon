[pytest]
testpaths = ui-tests/tests mock-backend/tests
python_files = test_*.py
addopts = -v --tb=short --strict-markers
env_files = .env
markers =
    ui: UI tests
    api: API tests
    kafka: Kafka integration tests
    critical: Critical tests
    smoke: Smoke tests
    regression: Regression tests

rp_endpoint = http://localhost:8080
rp_project = superadmin_personal
rp_launch = ozon-qa-portfolio
rp_launch_attributes = qa portfolio parallel
rp_log_batch_size = 20
